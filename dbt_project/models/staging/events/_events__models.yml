version: 2

models:
  - name: stg_events
    description: Одна строка на событие кликстрима, очищенная от источника `raw.events`.
    columns:
      - name: event_id
        data_tests:
          - unique
          - not_null
      - name: event_type
        data_tests:
          - accepted_values:
              values:
                - page_view
                - add_to_cart
                - checkout
