version: 2

sources:
  - name: raw
    description: >
      Таблицы, которые попадают в Postgres напрямую из внешнего пайплайна,
      минуя dbt (здесь: `docker/initdb/01_raw_events.sql`, выполняется один
      раз при первом запуске контейнера Postgres). dbt только читает их.
    schema: raw
    tables:
      - name: events
        description: Сырые события кликстрима (просмотры страниц, добавления в корзину, оформления заказа).
        loaded_at_field: loaded_at
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: event_id
            data_tests:
              - unique
              - not_null
          - name: customer_id
            data_tests:
              - not_null
