name: dbt-demo

services:
  postgres:
    image: postgres:16-alpine
    container_name: dbt_demo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dbt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbt_password}
      POSTGRES_DB: ${POSTGRES_DB:-dbt_demo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Наполняет схему `raw` только при первом запуске (на чистом volume). См. guide/03.
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dbt_user} -d ${POSTGRES_DB:-dbt_demo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  dbt:
    build:
      context: ./docker
      dockerfile: dbt.Dockerfile
    container_name: dbt_demo_dbt
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dbt_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dbt_password}
      POSTGRES_DB: ${POSTGRES_DB:-dbt_demo}
      DBT_PROFILES_DIR: /root/.dbt
    volumes:
      - ./dbt_project:/usr/app/dbt
      - ./dbt_project/profiles:/root/.dbt
    working_dir: /usr/app/dbt
    ports:
      - "8085:8085" # dbt docs serve (см. guide/11-documentation)
    tty: true

  adminer:
    image: adminer:4
    container_name: dbt_demo_adminer
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8080:8080"

volumes:
  pgdata:
